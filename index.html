<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Invitación Isabella</title>

<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f7f2e8;
}


/* =========================================
   PORTADA
========================================= */

.portada {
    position: relative;

    width: 100vw;
    height: 100vh;

    background-image: url("PORTADA%20SITE.png");

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    overflow: hidden;
}


/* =========================================
   REPRODUCTOR PERSONALIZADO
========================================= */

.audio-container {

    position: absolute;

    top: 4%;
    left: 4%;

    z-index: 20;
}


.reproductor {

    width: 270px;
    height: 42px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 6px 10px;

    background: rgba(255, 255, 255, 0.48);

    border: 1px solid rgba(255, 255, 255, 0.35);

    border-radius: 24px;

    backdrop-filter: blur(6px);

    -webkit-backdrop-filter: blur(6px);

    box-shadow:
        0 3px 12px rgba(70, 65, 45, 0.10);
}


/* =========================================
   BOTÓN PLAY
========================================= */

.play-button {

    flex-shrink: 0;

    width: 30px;
    height: 30px;

    border: none;

    border-radius: 50%;

    background: rgba(115, 123, 90, 0.82);

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 13px;

    padding-left: 2px;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.play-button:hover {

    transform: scale(1.06);

    background: rgba(115, 123, 90, 0.95);
}


/* =========================================
   INFORMACIÓN DEL AUDIO
========================================= */

.audio-info {

    flex: 1;

    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 4px;
}


/* Nombre */

.audio-title {

    font-size: 11px;

    color: #737b5a;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================
   BARRA DE PROGRESO
========================================= */

.progress-container {

    width: 100%;

    height: 5px;

    background:
        rgba(115, 123, 90, 0.18);

    border-radius: 10px;

    cursor: pointer;

    overflow: hidden;
}


.progress-bar {

    width: 0%;

    height: 100%;

    background: #737b5a;

    border-radius: 10px;

    transition: width 0.1s linear;
}


/* =========================================
   TIEMPO
========================================= */

.audio-time {

    flex-shrink: 0;

    font-size: 9px;

    color: #737b5a;

    min-width: 34px;

    text-align: right;
}


/* =========================================
   CONTADOR
========================================= */

.contador {

    position: absolute;

    left: 50%;

    bottom: 11%;

    transform: translateX(-50%);

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    z-index: 10;
}


/* =========================================
   CUADROS DEL CONTADOR
========================================= */

.caja {

    width: 82px;

    min-height: 78px;

    padding: 9px 5px;

    border-radius: 12px;

    background:
        rgba(255, 255, 255, 0.42);

    backdrop-filter: blur(3px);

    -webkit-backdrop-filter: blur(3px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 2px 8px rgba(90, 80, 50, 0.06);

    border:
        1px solid rgba(255,255,255,0.25);
}


/* =========================================
   NÚMEROS
========================================= */

.numero {

    font-size: 30px;

    line-height: 1;

    font-weight: bold;

    color: #737b5a;

    margin-bottom: 7px;
}


/* =========================================
   ETIQUETAS
========================================= */

.etiqueta {

    font-size: 14px;

    color: #737b5a;

    letter-spacing: 0.5px;
}


/* =========================================
   CELULAR
========================================= */

@media (max-width: 600px) {

    .portada {

        background-position: center center;
    }


    .audio-container {

        top: 3%;

        left: 4%;
    }


    .reproductor {

        width: 225px;

        height: 39px;

        padding: 5px 8px;

        gap: 8px;

        border-radius: 22px;
    }


    .play-button {

        width: 29px;

        height: 29px;

        font-size: 12px;
    }


    .audio-title {

        font-size: 10px;
    }


    .audio-time {

        font-size: 8px;

        min-width: 30px;
    }


    .contador {

        bottom: 12%;

        gap: 7px;

        width: 94%;
    }


    .caja {

        width: 23vw;

        min-height: 67px;

        padding: 7px 3px;

        border-radius: 10px;
    }


    .numero {

        font-size: 22px;

        margin-bottom: 5px;
    }


    .etiqueta {

        font-size: 12px;
    }

}


/* =========================================
   CELULARES MUY PEQUEÑOS
========================================= */

@media (max-width: 380px) {

    .contador {

        gap: 5px;
    }


    .caja {

        min-height: 62px;
    }


    .numero {

        font-size: 19px;
    }


    .etiqueta {

        font-size: 10px;
    }


    .reproductor {

        width: 205px;
    }

}

</style>

</head>


<body>


<div class="portada">


    <!-- =====================================
         REPRODUCTOR DE AUDIO
    ====================================== -->

    <div class="audio-container">

        <div class="reproductor">


            <button
                class="play-button"
                id="playButton"
                aria-label="Reproducir música">

                ▶

            </button>


            <div class="audio-info">


                <div class="audio-title">

                    Música

                </div>


                <div
                    class="progress-container"
                    id="progressContainer">

                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>

                </div>


            </div>


            <div
                class="audio-time"
                id="audioTime">

                0:00

            </div>


        </div>


        <!-- =================================
             AUDIO DESDE GITHUB
        ================================== -->

        <audio
            id="musica"
            preload="metadata">

            <source
                src="Abba%20-%20Slipping%20Through%20My%20Fingers.mp3"
                type="audio/mpeg">

        </audio>

    </div>



    <!-- =====================================
         CONTADOR
    ====================================== -->

    <div class="contador">


        <div class="caja">

            <div
                class="numero"
                id="dias">

                00

            </div>

            <div class="etiqueta">

                Días

            </div>

        </div>



        <div class="caja">

            <div
                class="numero"
                id="horas">

                00

            </div>

            <div class="etiqueta">

                Horas

            </div>

        </div>



        <div class="caja">

            <div
                class="numero"
                id="minutos">

                00

            </div>

            <div class="etiqueta">

                Min

            </div>

        </div>



        <div class="caja">

            <div
                class="numero"
                id="segundos">

                00

            </div>

            <div class="etiqueta">

                Seg

            </div>

        </div>


    </div>


</div>



<script>

/* ==========================================
   CONTADOR
   26/09/2026 - 19:00 HORA PERÚ
========================================== */


const fechaEvento =
    new Date(
        "2026-09-27T00:00:00Z"
    ).getTime();



function actualizarContador() {


    const ahora =
        new Date().getTime();


    const diferencia =
        fechaEvento - ahora;



    if (diferencia <= 0) {


        document.getElementById("dias")
            .textContent = "00";


        document.getElementById("horas")
            .textContent = "00";


        document.getElementById("minutos")
            .textContent = "00";


        document.getElementById("segundos")
            .textContent = "00";


        return;

    }



    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia /
            (1000 * 60 * 60)) % 24
        );


    const minutos =
        Math.floor(
            (diferencia /
            (1000 * 60)) % 60
        );


    const segundos =
        Math.floor(
            (diferencia / 1000) % 60
        );



    document.getElementById("dias")
        .textContent =
        String(dias).padStart(2, "0");


    document.getElementById("horas")
        .textContent =
        String(horas).padStart(2, "0");


    document.getElementById("minutos")
        .textContent =
        String(minutos).padStart(2, "0");


    document.getElementById("segundos")
        .textContent =
        String(segundos).padStart(2, "0");

}


actualizarContador();


setInterval(
    actualizarContador,
    1000
);



/* ==========================================
   REPRODUCTOR PERSONALIZADO
========================================== */


const musica =
    document.getElementById("musica");


const playButton =
    document.getElementById("playButton");


const progressContainer =
    document.getElementById("progressContainer");


const progressBar =
    document.getElementById("progressBar");


const audioTime =
    document.getElementById("audioTime");



/* ==========================================
   PLAY / PAUSA
========================================== */

playButton.addEventListener(
    "click",
    function() {


        if (musica.paused) {

            musica.play();

        } else {

            musica.pause();

        }

    }
);



/* ==========================================
   CAMBIAR ICONO
========================================== */

musica.addEventListener(
    "play",
    function() {

        playButton.textContent = "❚❚";

    }
);


musica.addEventListener(
    "pause",
    function() {

        playButton.textContent = "▶";

    }
);



/* ==========================================
   BARRA DE PROGRESO
========================================== */

musica.addEventListener(
    "timeupdate",
    function() {


        if (!musica.duration) {

            return;

        }


        const porcentaje =
            (musica.currentTime /
            musica.duration) * 100;


        progressBar.style.width =
            porcentaje + "%";


        actualizarTiempo();

    }
);



/* ==========================================
   DURACIÓN
========================================== */

musica.addEventListener(
    "loadedmetadata",
    function() {

        actualizarTiempo();

    }
);



/* ==========================================
   CLICK EN LA BARRA
========================================== */

progressContainer.addEventListener(
    "click",
    function(event) {


        if (!musica.duration) {

            return;

        }


        const rect =
            progressContainer
            .getBoundingClientRect();


        const posicion =
            event.clientX -
            rect.left;


        const porcentaje =
            posicion /
            rect.width;


        musica.currentTime =
            porcentaje *
            musica.duration;

    }
);



/* ==========================================
   MOSTRAR TIEMPO
========================================== */

function actualizarTiempo() {


    const minutos =
        Math.floor(
            musica.currentTime / 60
        );


    const segundos =
        Math.floor(
            musica.currentTime % 60
        );


    audioTime.textContent =
        minutos +
        ":" +
        String(segundos)
            .padStart(2, "0");

}

</script>


</body>

</html>
