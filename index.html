<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitación Isabella</title>

<style>

/* ================================
   CONFIGURACIÓN GENERAL
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #f7f2e8;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* ================================
   CONTENEDOR PRINCIPAL
================================ */

.portada {
    position: relative;

    width: 100vw;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    background: #f7f2e8;

    overflow: hidden;
}


/* ================================
   IMAGEN DE PORTADA
================================ */

/*
   IMPORTANTE:

   La imagen conserva SIEMPRE
   sus proporciones originales.

   No se estira.
   No se aplasta.
   No se deforma.
*/

.portada-imagen {
    display: block;

    width: 100vw;
    height: auto;

    max-width: 100%;

    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
}


/* ================================
   AUDIO
================================ */

.audio-container {

    position: absolute;

    top: 28px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    width: min(420px, 88vw);

}


/* Reproductor */

.audio-player {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 14px;

    padding: 10px 14px 10px 10px;

    border-radius: 50px;

    background: rgba(255, 255, 255, 0.72);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 4px 18px rgba(80, 70, 40, 0.15);

}


/* Botón */

.audio-button {

    flex-shrink: 0;

    width: 52px;
    height: 52px;

    border: none;

    border-radius: 50%;

    background: rgba(115, 123, 90, 0.92);

    color: white;

    font-size: 20px;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition: transform 0.2s ease;

}

.audio-button:active {

    transform: scale(0.94);

}


/* Información del audio */

.audio-info {

    flex: 1;

    min-width: 0;

}


/* Nombre */

.audio-title {

    font-size: 16px;

    color: #737b5a;

    margin-bottom: 5px;

}


/* Barra */

.audio-progress {

    width: 100%;

    height: 6px;

    border-radius: 10px;

    background: rgba(115, 123, 90, 0.18);

    overflow: hidden;

}


/* Progreso */

.audio-progress-bar {

    width: 0%;

    height: 100%;

    border-radius: 10px;

    background: #737b5a;

}


/* Tiempo */

.audio-time {

    flex-shrink: 0;

    font-size: 13px;

    color: #737b5a;

}


/* ================================
   CONTADOR
================================ */

.contador {

    position: absolute;

    left: 50%;

    bottom: 7%;

    transform: translateX(-50%);

    width: 94%;

    max-width: 760px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    z-index: 15;
}


/* Cada caja */

.caja {

    flex: 1;

    min-width: 0;

    min-height: 82px;

    padding: 10px 5px;

    border-radius: 13px;

    background: rgba(255, 255, 255, 0.68);

    backdrop-filter: blur(5px);

    -webkit-backdrop-filter: blur(5px);

    border: 1px solid rgba(255,255,255,0.35);

    box-shadow:
        0 3px 12px rgba(90, 80, 50, 0.10);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


/* Número */

.numero {

    font-size: 30px;

    line-height: 1;

    font-weight: bold;

    color: #737b5a;

    margin-bottom: 7px;
}


/* Texto */

.etiqueta {

    font-size: 14px;

    color: #737b5a;

    letter-spacing: 0.5px;
}


/* ================================
   CELULAR
================================ */

@media (max-width: 600px) {

    .portada {

        width: 100vw;

        min-height: 100vh;

    }


    /*
       La imagen ocupa exactamente
       el ancho disponible y mantiene
       su proporción.
    */

    .portada-imagen {

        width: 100vw;

        height: auto;

    }


    /* AUDIO CENTRADO */

    .audio-container {

        top: 18px;

        left: 50%;

        transform: translateX(-50%);

        width: 88vw;

        max-width: 400px;

    }


    .audio-player {

        padding: 8px 12px 8px 8px;

    }


    .audio-button {

        width: 46px;

        height: 46px;

        font-size: 18px;

    }


    .audio-title {

        font-size: 15px;

    }


    .audio-time {

        font-size: 12px;

    }


    /* CONTADOR */

    .contador {

        width: 94%;

        bottom: 5%;

        gap: 7px;

    }


    .caja {

        min-height: 70px;

        padding: 7px 3px;

        border-radius: 11px;

    }


    .numero {

        font-size: 23px;

        margin-bottom: 5px;

    }


    .etiqueta {

        font-size: 12px;

    }

}


/* ================================
   CELULARES MUY PEQUEÑOS
================================ */

@media (max-width: 380px) {

    .audio-container {

        width: 92vw;

        top: 14px;

    }


    .audio-button {

        width: 42px;

        height: 42px;

    }


    .contador {

        gap: 5px;

        bottom: 4%;

    }


    .caja {

        min-height: 63px;

    }


    .numero {

        font-size: 20px;

    }


    .etiqueta {

        font-size: 10px;

    }

}

</style>
</head>


<body>


<div class="portada">


    <!-- =================================
         PORTADA VERTICAL
    ================================== -->

    <img
        class="portada-imagen"
        src="PORTADA%20SITE%20VERTICAL.png"
        alt="Invitación Isabella"
    >


    <!-- =================================
         REPRODUCTOR DE MÚSICA
    ================================== -->

    <div class="audio-container">

        <div class="audio-player">

            <button
                class="audio-button"
                id="audioButton"
                aria-label="Reproducir música">
                ▶
            </button>


            <div class="audio-info">

                <div class="audio-title">
                    Música
                </div>

                <div class="audio-progress">

                    <div
                        class="audio-progress-bar"
                        id="progressBar">
                    </div>

                </div>

            </div>


            <div
                class="audio-time"
                id="audioTime">
                0:00
            </div>

        </div>


        <!--
            AUDIO DESDE GITHUB

            IMPORTANTE:
            El nombre debe coincidir exactamente
            con el MP3 que subiste.
        -->

        <audio
            id="musica"
            preload="metadata">

            <source
                src="Abba%20-%20Slipping%20Through%20My%20Fingers.mp3"
                type="audio/mpeg">

        </audio>

    </div>



    <!-- =================================
         CONTADOR
    ================================== -->

    <div class="contador">


        <div class="caja">

            <div
                class="numero"
                id="dias">
                00
            </div>

            <div class="etiqueta">
                Días
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="horas">
                00
            </div>

            <div class="etiqueta">
                Horas
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="minutos">
                00
            </div>

            <div class="etiqueta">
                Min
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="segundos">
                00
            </div>

            <div class="etiqueta">
                Seg
            </div>

        </div>


    </div>

</div>



<script>

/* ==========================================
   CONTADOR

   EVENTO:
   26 DE SEPTIEMBRE DE 2026
   19:00 HORAS - PERÚ
========================================== */

const fechaEvento =
    new Date("2026-09-27T00:00:00Z").getTime();


function actualizarContador() {

    const ahora =
        new Date().getTime();

    let diferencia =
        fechaEvento - ahora;


    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "00";

        document.getElementById("horas").textContent = "00";

        document.getElementById("minutos").textContent = "00";

        document.getElementById("segundos").textContent = "00";

        return;
    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia /
            (1000 * 60 * 60)) % 24
        );


    const minutos =
        Math.floor(
            (diferencia /
            (1000 * 60)) % 60
        );


    const segundos =
        Math.floor(
            (diferencia / 1000) % 60
        );


    document.getElementById("dias").textContent =
        String(dias).padStart(2, "0");


    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");


    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");


    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

}


actualizarContador();

setInterval(
    actualizarContador,
    1000
);



/* ==========================================
   REPRODUCTOR
========================================== */

const musica =
    document.getElementById("musica");


const audioButton =
    document.getElementById("audioButton");


const progressBar =
    document.getElementById("progressBar");


const audioTime =
    document.getElementById("audioTime");



/* PLAY / PAUSA */

audioButton.addEventListener(
    "click",
    function() {

        if (musica.paused) {

            musica.play();

            audioButton.textContent = "❚❚";

        } else {

            musica.pause();

            audioButton.textContent = "▶";

        }

    }
);



/* ACTUALIZAR BARRA */

musica.addEventListener(
    "timeupdate",
    function() {

        if (musica.duration) {

            const porcentaje =
                (musica.currentTime /
                musica.duration) * 100;


            progressBar.style.width =
                porcentaje + "%";


            const minutos =
                Math.floor(
                    musica.currentTime / 60
                );


            const segundos =
                Math.floor(
                    musica.currentTime % 60
                );


            audioTime.textContent =
                minutos +
                ":" +
                String(segundos).padStart(2, "0");

        }

    }
);



/* CUANDO TERMINA */

musica.addEventListener(
    "ended",
    function() {

        audioButton.textContent = "▶";

        progressBar.style.width = "0%";

        audioTime.textContent = "0:00";

    }
);

</script>


</body>
</html>
