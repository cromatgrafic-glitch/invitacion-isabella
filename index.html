```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Invitación Isabella</title>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f7f2e8;
}


/* =====================================================
   CONTENEDOR PRINCIPAL
===================================================== */

.portada {
    position: relative;

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    overflow: hidden;

    background: #f7f2e8;
}


/* =====================================================
   IMAGEN DE LA PORTADA

   PC = PORTADA SITE.png
   CELULAR = PORTADA SITE VERTICAL.png
===================================================== */

.portada-imagen {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center center;

    display: block;

    z-index: 1;
}


/* =====================================================
   AUDIO
===================================================== */

.audio-container {

    position: absolute;

    top: 3%;

    left: 50%;

    transform: translateX(-50%);

    width: min(430px, 90vw);

    z-index: 20;
}


.audio-player {

    width: 100%;

    min-height: 62px;

    display: flex;

    align-items: center;

    gap: 14px;

    padding: 9px 14px;

    border-radius: 35px;

    background: rgba(255, 255, 255, 0.78);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 4px 18px rgba(80, 70, 40, 0.14);
}


/* =====================================================
   BOTÓN PLAY / PAUSA
===================================================== */

.audio-button {

    flex-shrink: 0;

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: rgba(115, 123, 90, 0.88);

    color: white;

    font-size: 18px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 2px 8px rgba(60, 60, 40, 0.15);

    transition: transform 0.2s ease;
}

.audio-button:hover {
    transform: scale(1.05);
}


/* =====================================================
   INFORMACIÓN AUDIO
===================================================== */

.audio-info {
    flex: 1;
    min-width: 0;
}

.audio-title {

    color: #737b5a;

    font-size: 16px;

    margin-bottom: 7px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =====================================================
   BARRA AUDIO
===================================================== */

.audio-progress {

    width: 100%;

    height: 7px;

    appearance: none;
    -webkit-appearance: none;

    border: none;

    border-radius: 10px;

    background: rgba(115, 123, 90, 0.20);

    cursor: pointer;
}


.audio-progress::-webkit-slider-thumb {

    appearance: none;
    -webkit-appearance: none;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #737b5a;

    cursor: pointer;
}


.audio-progress::-moz-range-thumb {

    width: 12px;
    height: 12px;

    border: none;

    border-radius: 50%;

    background: #737b5a;

    cursor: pointer;
}


/* =====================================================
   TIEMPO AUDIO
===================================================== */

.audio-time {

    flex-shrink: 0;

    min-width: 40px;

    text-align: center;

    color: #737b5a;

    font-size: 13px;
}


/* =====================================================
   CONTADOR
===================================================== */

.contador {

    position: absolute;

    left: 50%;

    bottom: 4%;

    transform: translateX(-50%);

    width: min(850px, 92vw);

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    z-index: 20;
}


/* =====================================================
   CAJAS CONTADOR
===================================================== */

.caja {

    flex: 1;

    max-width: 180px;

    min-height: 78px;

    padding: 9px 5px;

    border-radius: 12px;

    background: rgba(255, 255, 255, 0.68);

    backdrop-filter: blur(5px);

    -webkit-backdrop-filter: blur(5px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 2px 10px rgba(90, 80, 50, 0.08);

    border: 1px solid rgba(255,255,255,0.35);
}


/* =====================================================
   NÚMEROS
===================================================== */

.numero {

    font-size: 30px;

    line-height: 1;

    font-weight: bold;

    color: #737b5a;

    margin-bottom: 7px;
}


/* =====================================================
   ETIQUETAS
===================================================== */

.etiqueta {

    font-size: 14px;

    color: #737b5a;

    letter-spacing: 0.5px;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 600px) {

    .audio-container {

        top: max(
            2.5%,
            env(safe-area-inset-top)
        );

        width: 90vw;

        max-width: 430px;
    }


    .audio-player {

        min-height: 58px;

        padding: 8px 11px;

        gap: 10px;
    }


    .audio-button {

        width: 42px;

        height: 42px;

        font-size: 17px;
    }


    .audio-title {

        font-size: 15px;

        margin-bottom: 6px;
    }


    .audio-time {

        font-size: 12px;

        min-width: 36px;
    }


    /* ---------------------------------------------
       CONTADOR CELULAR
    --------------------------------------------- */

    .contador {

        bottom: max(
            2.5%,
            env(safe-area-inset-bottom)
        );

        width: 94vw;

        gap: 7px;
    }


    .caja {

        width: 23vw;

        max-width: none;

        min-height: 68px;

        padding: 7px 3px;

        border-radius: 10px;
    }


    .numero {

        font-size: 23px;

        margin-bottom: 5px;
    }


    .etiqueta {

        font-size: 12px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media (max-width: 380px) {

    .audio-container {
        width: 92vw;
    }


    .audio-player {

        min-height: 54px;

        padding: 7px 9px;
    }


    .audio-button {

        width: 39px;

        height: 39px;

        font-size: 16px;
    }


    .audio-title {
        font-size: 14px;
    }


    .contador {

        width: 96vw;

        gap: 5px;

        bottom: 2%;
    }


    .caja {

        min-height: 62px;

        border-radius: 9px;
    }


    .numero {
        font-size: 19px;
    }


    .etiqueta {
        font-size: 10px;
    }

}

</style>

</head>


<body>


<div class="portada">


    <!-- =================================================
         PORTADA RESPONSIVA

         PC:
         PORTADA SITE.png

         CELULAR:
         PORTADA SITE VERTICAL.png
    ================================================== -->

    <picture>

        <source
            media="(max-width: 600px)"
            srcset="PORTADA%20SITE%20VERTICAL.png">

        <img
            class="portada-imagen"
            src="PORTADA%20SITE.png"
            alt="Invitación Isabella">

    </picture>



    <!-- =================================================
         AUDIO
    ================================================== -->

    <div class="audio-container">

        <div class="audio-player">


            <button
                class="audio-button"
                id="audioButton"
                aria-label="Reproducir música">

                ▶

            </button>


            <div class="audio-info">

                <div class="audio-title">
                    Música
                </div>


                <input
                    type="range"
                    class="audio-progress"
                    id="audioProgress"
                    min="0"
                    max="100"
                    value="0">

            </div>


            <div
                class="audio-time"
                id="audioTime">

                0:00

            </div>


        </div>


        <!-- AUDIO MP3 DESDE GITHUB -->

        <audio
            id="musica"
            preload="metadata">

            <source
                src="https://raw.githubusercontent.com/cromatgrafic-glitch/invitacion-isabella/main/Abba%20-%20Slipping%20Through%20My%20Fingers.mp3"
                type="audio/mpeg">

        </audio>

    </div>



    <!-- =================================================
         CONTADOR
    ================================================== -->

    <div class="contador">


        <div class="caja">

            <div
                class="numero"
                id="dias">

                00

            </div>

            <div class="etiqueta">
                Días
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="horas">

                00

            </div>

            <div class="etiqueta">
                Horas
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="minutos">

                00

            </div>

            <div class="etiqueta">
                Min
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="segundos">

                00

            </div>

            <div class="etiqueta">
                Seg
            </div>

        </div>


    </div>


</div>



<script>

/* =====================================================
   CONTADOR
===================================================== */

const fechaEvento =
    new Date("2026-09-27T00:00:00Z").getTime();


function actualizarContador() {

    const ahora =
        new Date().getTime();

    const diferencia =
        fechaEvento - ahora;


    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "00";

        document.getElementById("horas").textContent = "00";

        document.getElementById("minutos").textContent = "00";

        document.getElementById("segundos").textContent = "00";

        return;
    }


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    const horas =
        Math.floor(
            (diferencia /
            (1000 * 60 * 60)) % 24
        );


    const minutos =
        Math.floor(
            (diferencia /
            (1000 * 60)) % 60
        );


    const segundos =
        Math.floor(
            (diferencia / 1000) % 60
        );


    document.getElementById("dias").textContent =
        String(dias).padStart(2, "0");


    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");


    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");


    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

}


actualizarContador();

setInterval(
    actualizarContador,
    1000
);



/* =====================================================
   AUDIO
===================================================== */

const musica =
    document.getElementById("musica");

const audioButton =
    document.getElementById("audioButton");

const audioProgress =
    document.getElementById("audioProgress");

const audioTime =
    document.getElementById("audioTime");


/* =====================================================
   PLAY / PAUSA
===================================================== */

audioButton.addEventListener(
    "click",
    function() {

        if (musica.paused) {

            musica.play()
                .then(function() {

                    audioButton.textContent =
                        "❚❚";

                })
                .catch(function(error) {

                    console.log(
                        "Error al reproducir:",
                        error
                    );

                });

        } else {

            musica.pause();

            audioButton.textContent =
                "▶";

        }

    }
);


/* =====================================================
   DURACIÓN
===================================================== */

musica.addEventListener(
    "loadedmetadata",
    function() {

        audioProgress.max =
            musica.duration;

    }
);


/* =====================================================
   BARRA DE PROGRESO
===================================================== */

musica.addEventListener(
    "timeupdate",
    function() {

        audioProgress.value =
            musica.currentTime;


        const minutos =
            Math.floor(
                musica.currentTime / 60
            );


        const segundos =
            Math.floor(
                musica.currentTime % 60
            );


        audioTime.textContent =
            minutos +
            ":" +
            String(segundos).padStart(2, "0");

    }
);


/* =====================================================
   MOVERSE EN LA CANCIÓN
===================================================== */

audioProgress.addEventListener(
    "input",
    function() {

        musica.currentTime =
            audioProgress.value;

    }
);


/* =====================================================
   CANCIÓN TERMINADA
===================================================== */

musica.addEventListener(
    "ended",
    function() {

        audioButton.textContent =
            "▶";

        audioProgress.value =
            0;

        audioTime.textContent =
            "0:00";

    }
);

</script>


</body>

</html>
```
