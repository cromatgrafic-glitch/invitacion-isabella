<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Invitación Isabella</title>


<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

}


body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #f7f2e8;

}


/* =========================================
   PORTADA
========================================= */

.portada {

    position: relative;

    width: 100vw;
    height: 100vh;

    background-image:
        url("PORTADA%20SITE.png");

    background-size: cover;

    background-position: center center;

    background-repeat: no-repeat;

    overflow: hidden;

}


/* =========================================
   AUDIO
========================================= */

.audio-container {

    position: absolute;

    top: 4%;

    left: 4%;

    z-index: 20;

}


/* Reproductor */

.audio-container audio {

    width: 270px;

    height: 38px;

    opacity: 0.58;

    border-radius: 20px;

}


/* =========================================
   CONTADOR
========================================= */

.contador {

    position: absolute;

    left: 50%;

    bottom: 11%;

    transform: translateX(-50%);

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    z-index: 10;

}


/* =========================================
   CUADROS DEL CONTADOR
========================================= */

.caja {

    width: 82px;

    min-height: 78px;

    padding: 9px 5px;

    border-radius: 12px;

    background:
        rgba(255, 255, 255, 0.42);

    backdrop-filter: blur(3px);

    -webkit-backdrop-filter: blur(3px);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 2px 8px
        rgba(90, 80, 50, 0.06);

    border:
        1px solid
        rgba(255,255,255,0.25);

}


/* =========================================
   NÚMEROS
========================================= */

.numero {

    font-size: 30px;

    line-height: 1;

    font-weight: bold;

    color: #737b5a;

    margin-bottom: 7px;

}


/* =========================================
   ETIQUETAS
========================================= */

.etiqueta {

    font-size: 14px;

    color: #737b5a;

    letter-spacing: 0.5px;

}


/* =========================================
   CELULAR
========================================= */

@media (max-width: 600px) {


    .portada {

        background-position:
            center center;

    }


    /* AUDIO */

    .audio-container {

        top: 3%;

        left: 4%;

    }


    .audio-container audio {

        width: 225px;

        height: 35px;

        opacity: 0.58;

    }


    /* CONTADOR */

    .contador {

        bottom: 12%;

        gap: 7px;

        width: 94%;

    }


    .caja {

        width: 23vw;

        min-height: 67px;

        padding: 7px 3px;

        border-radius: 10px;

    }


    .numero {

        font-size: 22px;

        margin-bottom: 5px;

    }


    .etiqueta {

        font-size: 12px;

    }

}


/* =========================================
   CELULARES PEQUEÑOS
========================================= */

@media (max-width: 380px) {


    .contador {

        gap: 5px;

    }


    .caja {

        min-height: 62px;

    }


    .numero {

        font-size: 19px;

    }


    .etiqueta {

        font-size: 10px;

    }


    .audio-container audio {

        width: 205px;

    }

}

</style>

</head>


<body>


<div class="portada">


    <!-- =====================================
         AUDIO
    ====================================== -->

    <div class="audio-container">

        <audio
            id="musica"
            controls
            preload="metadata">

            <source
                src="https://drive.google.com/uc?export=download&id=1kl_ws4CFKa581VIDeT-GdW4OSPraZ6gV"
                type="audio/mpeg">

            Tu navegador no soporta
            el reproductor de audio.

        </audio>

    </div>


    <!-- =====================================
         CONTADOR
    ====================================== -->

    <div class="contador">


        <div class="caja">

            <div
                class="numero"
                id="dias">
                00
            </div>

            <div
                class="etiqueta">
                Días
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="horas">
                00
            </div>

            <div
                class="etiqueta">
                Horas
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="minutos">
                00
            </div>

            <div
                class="etiqueta">
                Min
            </div>

        </div>


        <div class="caja">

            <div
                class="numero"
                id="segundos">
                00
            </div>

            <div
                class="etiqueta">
                Seg
            </div>

        </div>


    </div>


</div>


<script>

/* ==========================================
   FECHA DEL EVENTO

   26 DE SEPTIEMBRE DE 2026
   19:00 HORAS
   HORA DE PERÚ

   Perú = UTC -5

   19:00 Perú
   =
   00:00 UTC del 27 de septiembre
========================================== */


const fechaEvento =
    new Date(
        "2026-09-27T00:00:00Z"
    ).getTime();



/* ==========================================
   ACTUALIZAR CONTADOR
========================================== */


function actualizarContador() {


    const ahora =
        new Date().getTime();


    const diferencia =
        fechaEvento - ahora;



    /* ================================
       CUANDO LLEGUE LA FECHA
    ================================= */


    if (diferencia <= 0) {


        document
            .getElementById("dias")
            .textContent = "00";


        document
            .getElementById("horas")
            .textContent = "00";


        document
            .getElementById("minutos")
            .textContent = "00";


        document
            .getElementById("segundos")
            .textContent = "00";


        return;

    }



    /* ================================
       DÍAS
    ================================= */


    const dias =
        Math.floor(
            diferencia /
            (1000 * 60 * 60 * 24)
        );



    /* ================================
       HORAS
    ================================= */


    const horas =
        Math.floor(
            (diferencia /
            (1000 * 60 * 60)) % 24
        );



    /* ================================
       MINUTOS
    ================================= */


    const minutos =
        Math.floor(
            (diferencia /
            (1000 * 60)) % 60
        );



    /* ================================
       SEGUNDOS
    ================================= */


    const segundos =
        Math.floor(
            (diferencia / 1000) % 60
        );



    /* ================================
       MOSTRAR RESULTADO
    ================================= */


    document
        .getElementById("dias")
        .textContent =
        String(dias)
        .padStart(2, "0");


    document
        .getElementById("horas")
        .textContent =
        String(horas)
        .padStart(2, "0");


    document
        .getElementById("minutos")
        .textContent =
        String(minutos)
        .padStart(2, "0");


    document
        .getElementById("segundos")
        .textContent =
        String(segundos)
        .padStart(2, "0");

}


/* ==========================================
   INICIAR CONTADOR
========================================== */


actualizarContador();


setInterval(
    actualizarContador,
    1000
);

</script>


</body>

</html>
